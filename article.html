<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コラム | PhotoMatch</title>
<!-- 旧URL。コラムは記事ごとの個別ページ（column-<id>.html）に移行したため、
     ここは転送専用。検索結果には出さない。 -->
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/photomatch-icon-transparent.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script>
  // ?id= が付いていればその記事へ、なければ一覧へ。
  // replace() を使い、戻るボタンでこのページに戻らないようにする。
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    var valid = /^[a-z0-9-]+$/i.test(id || '');
    location.replace(valid ? 'column-' + id + '.html' : 'column.html');
  })();
</script>
</head>
<body>
  <main class="pm-wrap-narrow" style="padding:64px clamp(20px,5vw,32px)">
    <p style="font:15px/1.9 var(--pm-font-body);color:var(--pm-text-3)">
      コラムページへ移動しています。切り替わらない場合は
      <a href="column.html" style="color:oklch(0.45 0.14 210);font-weight:700">コラム一覧</a>
      からお進みください。
    </p>
  </main>
</body>
</html>
