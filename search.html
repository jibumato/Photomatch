<header class="pm-header" id="pm-header"></header>

<main>
  <section class="pm-wrap" style="padding:24px 32px 0">
    <a class="pm-back-link" href="index.html" data-i18n="search.back">← トップに戻る</a>
    <h1 id="pm-results-title" style="font:700 26px var(--pm-font-body);margin:16px 0 4px" data-i18n="search.title">カメラマンを探す</h1>
    <p id="pm-result-count" style="color:var(--pm-text-3);font:14px var(--pm-font-body);margin:0"></p>
  </section>

  <section class="pm-wrap" style="padding:20px 32px 0">
    <!-- スマホでは折りたたみ、デスクトップでは常に展開（掲載人数が少ない今は
         絞り込みカードが最初の画面の大半を占めてしまうため）。 -->
    <details class="pm-card pm-filter-details">
      <summary class="pm-filter-summary">
        <span>
          <span data-i18n="search.filterToggle">絞り込み・並び替え</span>
          <span id="pm-filter-summary-note" class="pm-filter-summary-note"></span>
        </span>
        <span id="pm-filter-summary-hint" class="pm-filter-summary-hint"></span>
      </summary>
      <div class="pm-filter-body">
        <div>
          <div style="font:700 12px var(--pm-font-body);color:var(--pm-text-2);letter-spacing:0.04em;margin-bottom:10px" data-i18n="search.filter.area">撮影エリア</div>
          <div id="pm-area-chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--pm-border-faint);padding-top:16px;margin-top:16px">
          <div style="flex:1;min-width:200px">
            <div style="font:700 12px var(--pm-font-body);color:var(--pm-text-2);letter-spacing:0.04em;margin-bottom:10px" data-i18n="search.filter.conditions">こだわり条件</div>
            <label id="pm-female-toggle" style="display:inline-flex;align-items:center;gap:9px;cursor:pointer;font:600 13px var(--pm-font-body);color:oklch(0.32 0.02 240)">
              <input type="checkbox" id="pm-female-only" style="width:18px;height:18px;accent-color:oklch(0.66 0.13 236);cursor:pointer">
              <span data-i18n="search.filter.femaleOnly">女性カメラマンのみ</span>
            </label>
            <div style="font:11px/1.7 var(--pm-font-body);color:var(--pm-text-muted);margin-top:6px;margin-bottom:10px" data-i18n="search.filter.femaleNote">同伴者ありでの撮影もご相談いただけます。</div>
            <label id="pm-english-toggle" style="display:inline-flex;align-items:center;gap:9px;cursor:pointer;font:600 13px var(--pm-font-body);color:oklch(0.32 0.02 240)">
              <input type="checkbox" id="pm-english-only" style="width:18px;height:18px;accent-color:oklch(0.66 0.13 236);cursor:pointer">
              <span data-i18n="search.filter.englishOnly">英語対応カメラマンのみ</span>
            </label>
          </div>
          <div style="min-width:180px">
            <label style="display:block;font:700 12px var(--pm-font-body);color:var(--pm-text-2);letter-spacing:0.04em;margin-bottom:10px" for="pm-sort" data-i18n="search.filter.sort">並び替え</label>
            <select class="pm-select" id="pm-sort">
              <option value="recommended" data-i18n="search.sort.recommended">おすすめ順</option>
              <option value="rating" data-i18n="search.sort.rating">評価が高い順</option>
              <option value="reviews" data-i18n="search.sort.reviews">レビューが多い順</option>
            </select>
          </div>
        </div>
      </div>
    </details>

    <div id="pm-loading" class="pm-loading" data-i18n="common.loading">読み込み中…</div>
    <div id="pm-results" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px"></div>
