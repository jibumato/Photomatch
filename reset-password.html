<body>

<header class="pm-header" id="pm-header"></header>

<main>
  <section style="max-width:420px;margin:0 auto;padding:56px 32px 100px">
    <a class="pm-back-link" href="login.html" id="back-link" data-i18n="reset.back">← ログインに戻る</a>
    <h1 id="form-title" style="font:700 26px var(--pm-font-body);margin:20px 0 6px" data-i18n="reset.title">パスワード再設定</h1>
    <div id="pm-loading" class="pm-loading" style="padding:24px 0" data-i18n="common.loading">読み込み中…</div>

    <!-- step 1: ask for the reset email -->
    <div id="request-view" style="display:none">
      <p style="font:13px/1.8 var(--pm-font-body);color:var(--pm-text-3);margin:0 0 24px" data-i18n="reset.request.lead">ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
      <div id="link-error" class="pm-note-box" style="display:none;margin-bottom:18px"></div>
      <div class="pm-card" style="padding:24px;display:flex;flex-direction:column;gap:18px">
        <div class="pm-field">
          <label for="f-email" data-i18n="reset.request.emailLabel">メールアドレス</label>
          <input class="pm-input" type="email" id="f-email" autocomplete="email" inputmode="email" placeholder="guest@example.com">
        </div>
        <div class="pm-error-text" id="request-error" style="display:none"></div>
        <button class="pm-btn pm-btn-primary pm-btn-block" id="request-btn" data-i18n="reset.request.button">再設定メールを送る</button>
      </div>
      <div id="request-done" class="pm-note-box" style="display:none;margin-top:18px"></div>
    </div>

    <!-- step 2: opened from the email — choose a new password -->
    <div id="update-view" style="display:none">
      <p style="font:13px/1.8 var(--pm-font-body);color:var(--pm-text-3);margin:0 0 24px" data-i18n="reset.update.lead">新しいパスワードを入力してください。</p>
      <div class="pm-card" style="padding:24px;display:flex;flex-direction:column;gap:18px">
        <div class="pm-field">
          <label for="f-password" data-i18n="reset.update.passwordLabel">新しいパスワード</label>
          <input class="pm-input" type="password" id="f-password" autocomplete="new-password" placeholder="6文字以上" data-i18n-placeholder="booking.contact.passwordPlaceholder">
        </div>
        <div class="pm-field">
          <label for="f-password2" data-i18n="reset.update.password2Label">新しいパスワード（確認）</label>
          <input class="pm-input" type="password" id="f-password2" autocomplete="new-password" placeholder="もう一度入力" data-i18n-placeholder="reset.update.password2Placeholder">
        </div>
        <div class="pm-error-text" id="update-error" style="display:none"></div>
        <button class="pm-btn pm-btn-primary pm-btn-block" id="update-btn" data-i18n="reset.update.button">パスワードを変更する</button>
      </div>
    </div>

    <!-- step 3: done -->
    <div id="done-view" style="display:none">
      <div class="pm-note-box"><span class="pm-note-title" data-i18n="reset.done.title">パスワードを変更しました</span><span id="done-body"></span></div>
    </div>
  </section>
</main>

<footer class="pm-footer" id="pm-footer"></footer>
