<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | PhotoMatch</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/photomatch-icon-transparent.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="pm-header" id="pm-header"></header>

<main>
  <section style="max-width:420px;margin:0 auto;padding:56px 32px 100px">
    <a class="pm-back-link" href="index.html" data-i18n="search.back">← トップに戻る</a>
    <h1 id="form-title" style="font:700 26px var(--pm-font-body);margin:20px 0 6px" data-i18n="login.title.login">ログイン</h1>
    <p style="font:13px/1.8 var(--pm-font-body);color:var(--pm-text-3);margin:0 0 24px" data-i18n="login.lead">マイページから予約情報を確認できます。</p>

    <div class="pm-card" style="padding:24px;display:flex;flex-direction:column;gap:18px">
      <div class="pm-field" id="name-field" style="display:none">
        <label data-i18n="login.field.name">お名前</label>
        <input class="pm-input" type="text" id="f-name" placeholder="例）山田 太郎" data-i18n-placeholder="booking.contact.namePlaceholder">
      </div>
      <div class="pm-field" id="gender-field" style="display:none">
        <label for="f-gender" data-i18n="login.field.gender">性別</label>
        <select class="pm-select" id="f-gender"></select>
        <div style="font:11px/1.6 var(--pm-font-body);color:var(--pm-text-3);margin-top:6px" data-i18n="login.gender.hint">「異性スタッフ写真セレクト」（オプション）の担当を決めるために使います。ほかの用途には使いません。</div>
      </div>
      <div class="pm-field">
        <label data-i18n="login.field.email">メールアドレス</label>
        <input class="pm-input" type="email" id="f-email" placeholder="guest@example.com">
      </div>
      <div class="pm-field">
        <label data-i18n="login.field.password">パスワード</label>
        <input class="pm-input" type="password" id="f-password" placeholder="パスワード" data-i18n-placeholder="login.field.password">
      </div>
      <div class="pm-error-text" id="form-error" style="display:none"></div>
      <button class="pm-btn pm-btn-primary pm-btn-block" id="submit-btn" data-i18n="login.submit.login">ログイン</button>
      <a href="reset-password.html" id="forgot-link" style="align-self:center;font:12px var(--pm-font-body);color:oklch(0.45 0.14 210);text-decoration:underline" data-i18n="login.forgot">パスワードをお忘れの方</a>
    </div>

    <p style="text-align:center;margin-top:18px;font:13px var(--pm-font-body);color:var(--pm-text-3)">
      <span id="toggle-prefix" data-i18n="login.toggle.toSignup.prefix">アカウントをお持ちでない方は </span><span id="toggle-mode" style="cursor:pointer;color:oklch(0.45 0.14 210);font-weight:700;text-decoration:underline" data-i18n="login.toggle.toSignup.link">新規登録</span>
    </p>
  </section>
</main>

<footer class="pm-footer" id="pm-footer"></footer>

<script type="module" src="js/pages/login.js"></script>
</body>
</html>
