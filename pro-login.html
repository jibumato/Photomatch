<body>

<header class="pm-header" id="pm-header"></header>

<main>
  <section style="max-width:420px;margin:0 auto;padding:56px 32px 100px">
    <a class="pm-back-link" href="index.html">← トップに戻る</a>
    <div style="margin-top:20px">
      <span style="background:var(--pm-pro-navy);color:#fff;font:700 11px var(--pm-font-body);padding:4px 12px;border-radius:100px;display:inline-block">カメラマン管理</span>
    </div>
    <h1 id="form-title" style="font:700 26px var(--pm-font-body);margin:12px 0 6px">カメラマンログイン</h1>
    <p style="font:13px/1.8 var(--pm-font-body);color:var(--pm-text-3);margin:0 0 24px">シフト管理・予約者とのメッセージはこちらから。</p>

    <div class="pm-card" style="padding:24px;display:flex;flex-direction:column;gap:18px">
      <div class="pm-field" id="name-field" style="display:none">
        <label>お名前</label>
        <input class="pm-input" type="text" id="f-name" placeholder="例）山田 太郎">
      </div>
      <div class="pm-field">
        <label>メールアドレス</label>
        <input class="pm-input" type="email" id="f-email" placeholder="camera@photomatch.jp">
      </div>
      <div class="pm-field">
        <label>パスワード</label>
        <input class="pm-input" type="password" id="f-password" placeholder="パスワード">
      </div>
      <div class="pm-error-text" id="form-error" style="display:none"></div>
      <button class="pm-btn pm-btn-navy" id="submit-btn">ログイン</button>
      <a href="reset-password.html" id="forgot-link" style="align-self:center;font:12px var(--pm-font-body);color:oklch(0.45 0.14 210);text-decoration:underline">パスワードをお忘れの方</a>
    </div>

    <p style="text-align:center;margin-top:18px;font:13px var(--pm-font-body);color:var(--pm-text-3)">
      アカウントをお持ちでない方は <span id="toggle-mode" style="cursor:pointer;color:oklch(0.45 0.14 210);font-weight:700;text-decoration:underline">新規登録</span>
    </p>
  </section>
</main>

<footer class="pm-footer" id="pm-footer"></footer>
<div style="text-align:center;padding:14px 16px 24px;font:12px var(--pm-font-body);color:var(--pm-text-3);background:var(--pm-bg)">
